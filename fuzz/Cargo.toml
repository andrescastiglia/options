[package]
name = "options-trading-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
options-trading = { path = ".." }

[[bin]]
name = "market_frame"
path = "fuzz_targets/market_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "journal_event"
path = "fuzz_targets/journal_event.rs"
test = false
doc = false
bench = false

[[bin]]
name = "iol_protocol"
path = "fuzz_targets/iol_protocol.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
